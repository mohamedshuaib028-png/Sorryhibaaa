<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hiba, I’m sorry</title>
<style>
:root{--bg1:#ffe4e8;--bg2:#f4becd;--card:#fffbfc;--ink:#5a3c4b;--accent:#c84669;--btn:#c84669;--btnt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1620;--bg2:#4a2335;--card:#3a2030;--ink:#f6dbe4;--accent:#ff8fb0;--btn:#ff8fb0;--btnt:#2a1620}}
:root[data-theme="dark"]{--bg1:#2a1620;--bg2:#4a2335;--card:#3a2030;--ink:#f6dbe4;--accent:#ff8fb0;--btn:#ff8fb0;--btnt:#2a1620}
html,body{height:100%;margin:0}
body{background:linear-gradient(var(--bg1),var(--bg2));font-family:Georgia,'Times New Roman',serif;color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card{background:var(--card);border-radius:28px;padding:32px 24px;width:min(88vw,400px);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.15);position:relative;z-index:2}
.big{font-size:52px;margin:0 0 6px}
h1{font-size:30px;margin:6px 0;color:var(--accent)}
p{font-size:19px;line-height:1.5;margin:10px 0}
.row{display:flex;gap:14px;justify-content:center;margin-top:22px;min-height:54px}
button{font-family:inherit;font-size:19px;border:0;border-radius:999px;padding:14px 26px;background:var(--btn);color:var(--btnt);cursor:pointer}
#no{background:transparent;color:var(--ink);border:2px solid var(--accent)}
#no.run{position:fixed;z-index:5}
.hide{display:none}
.heart{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<div class="card" id="ask">
  <div class="big">🥺</div>
  <h1>Hiba, I’m sorry.</h1>
  <p>I know I upset you and I regret it. I’m sorry. Can you please tell me what pissed you off?</p>
  <p><b>And do you forgive me?</b></p>
  <div class="row">
    <button id="yes">Yes 🤍</button>
    <button id="no">No</button>
  </div>
  <p id="hint" style="font-size:15px;opacity:.7;min-height:20px"></p>
</div>
<div class="card hide" id="done">
  <div class="big">🥹</div>
  <h1>Thank you, Hiba.</h1>
  <p>I’ll do better. I miss my fatty Hiba so come backkkk 😭🤍</p>
  <p>Screenshot this and send it to me so I know it’s chill scene 😌</p>
  <div class="row"><button id="again">Play again</button></div>
</div>
<script>
var no=document.getElementById('no'),yes=document.getElementById('yes'),hint=document.getElementById('hint');
var msgs=['Nice try 😌','Are you sure? 🥺','The No button is broken 😅','Please? 🥹','Just tap Yes 🤍'];
var n=0;
function dodge(e){
  if(e){e.preventDefault();}
  no.classList.add('run');
  var w=window.innerWidth-no.offsetWidth-20,h=window.innerHeight-no.offsetHeight-20;
  no.style.left=Math.max(10,Math.random()*w)+'px';
  no.style.top=Math.max(10,Math.random()*h)+'px';
  hint.textContent=msgs[Math.min(n,msgs.length-1)];n++;
  yes.style.transform='scale('+Math.min(1+n*0.12,1.8)+')';
}
no.addEventListener('pointerenter',dodge);
no.addEventListener('touchstart',dodge,{passive:false});
no.addEventListener('click',dodge);
function hearts(){
  var e=['🤍','💗','💖','🌸','✨'];
  for(var i=0;i<45;i++){
    var s=document.createElement('span');s.className='heart';
    s.textContent=e[i%e.length];
    s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=(2+Math.random()*3)+'s';
    s.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(s);
    setTimeout(function(x){x.remove()},6500,s);
  }
}
yes.addEventListener('click',function(){
  document.getElementById('ask').classList.add('hide');
  no.classList.remove('run');
  document.getElementById('done').classList.remove('hide');
  hearts();
});
document.getElementById('again').addEventListener('click',function(){
  n=0;hint.textContent='';yes.style.transform='';no.classList.remove('run');no.style.left=no.style.top='';
  document.getElementById('done').classList.add('hide');
  document.getElementById('ask').classList.remove('hide');
});
</script>
</body>
</html>
